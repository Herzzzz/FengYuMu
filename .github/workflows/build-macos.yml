name: Build macOS DMG

# macOS 包只能在 Darwin 上构建（hdiutil / codesign / Xcode 26 都是 macOS 专有），
# 因此用 GitHub 的 macOS runner 出包，并直接挂到对应 Release 上。
on:
  # push tag 触发不依赖默认分支，而 workflow_dispatch 的按钮只出现在默认分支上，
  # 因此以 tag 为准入口。
  push:
    tags:
      - 'v*-mac*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要挂载资产的目标 tag（留空则只产出 artifact，不发布）'
        required: false
        default: 'v3.2.3-mac.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 显示构建环境
        run: |
          sw_vers
          uname -m
          swift --version || true

      - name: 构建 DMG
        run: bash macos/scripts/build-release.sh

      - name: 列出产物
        run: ls -la macos/*.dmg macos/*.sha256 2>/dev/null || ls -la macos/

      - name: 上传 artifact（总是执行，便于排查）
        uses: actions/upload-artifact@v4
        with:
          name: FengYuMu-macOS-DMG
          path: |
            macos/*.dmg
            macos/*.dmg.sha256
          if-no-files-found: warn

      - name: 挂到 Release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 手动触发用输入值，tag 触发用 tag 名本身。
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "目标 tag: $TAG"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --title "枫语幕 $TAG" --notes "macOS Apple 芯片版"
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            macos/*.dmg macos/*.dmg.sha256

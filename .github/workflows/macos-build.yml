name: macOS arm64 build

on:
  workflow_dispatch:
  push:
    paths:
      - "macos/**"
      - "枫语幕词库.tsv"
      - ".github/workflows/macos-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer and privacy invariants
        run: |
          zsh -n macos/首次安装.command macos/scripts/build-release.sh
          ! grep -Eq 'com\.apple\.quarantine|codesign[[:space:]].*--sign|codesign[[:space:]].*--force' macos/首次安装.command
          ! grep -Fq '/bin/rm -rf -- "${TARGET_APP}"' macos/首次安装.command
          ! grep -Fq 'open "${TARGET_APP}"' macos/首次安装.command
          grep -Fq 'gameWindows.filter' macos/Sources/FengYuMuMac/ScreenCaptureService.swift
          grep -Fq 'application.bundleIdentifier' macos/Sources/FengYuMuMac/ScreenCaptureService.swift
          grep -Fq 'hidesOnDeactivate = false' macos/Sources/FengYuMuMac/AppDelegate.swift
          grep -Fq 'state.setChatMonitoring(false)' macos/Sources/FengYuMuMac/AppDelegate.swift
      - name: Test core and build arm64 app
        run: zsh macos/scripts/build-release.sh
      - name: Verify product
        run: |
          codesign --verify --deep --strict --verbose=2 macos/.build/product/枫语幕.app
          plutil -lint macos/.build/product/枫语幕.app/Contents/Info.plist
          test "$(plutil -extract CFBundleVersion raw macos/.build/product/枫语幕.app/Contents/Info.plist)" = "32202"
          test "$(plutil -extract LSMinimumSystemVersion raw macos/.build/product/枫语幕.app/Contents/Info.plist)" = "26.6.2"
          test "$(file macos/.build/product/枫语幕.app/Contents/MacOS/FengYuMuMac | grep -c arm64)" -eq 1
          test -s macos/.build/product/枫语幕.app/Contents/Resources/枫语幕词库.tsv
      - name: Launch app smoke test
        run: |
          open macos/.build/product/枫语幕.app
          for attempt in {1..20}; do
            pgrep -x FengYuMuMac >/dev/null && break
            sleep 0.5
          done
          pgrep -x FengYuMuMac >/dev/null
          sleep 2
          screencapture -x macos/.build/macos-ui-smoke.png || true
          killall FengYuMuMac
      - uses: actions/upload-artifact@v4
        with:
          name: FengYuMu-macOS26-arm64
          path: |
            macos/枫语幕_*_macOS26_arm64.dmg
            macos/枫语幕_*_macOS26_arm64.dmg.sha256
            macos/.build/macos-ui-smoke.png
